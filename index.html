<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<meta name="theme-color" content="#05040b">

<title>لأغلى إنسانة 🤍</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
}

body{

    overflow:hidden;

    font-family:
        "Cairo",
        "Tajawal",
        Arial,
        sans-serif;

    background:#04030a;

    color:#fff;

    -webkit-font-smoothing:antialiased;

    touch-action:manipulation;

    perspective:1400px;
}


/* =========================================================
   STAR SKY
========================================================= */

.sky{

    position:fixed;

    inset:0;

    z-index:0;

    pointer-events:none;

    background:

        radial-gradient(
            circle at 50% 0%,
            rgba(108,76,160,.20),
            transparent 34%
        ),

        radial-gradient(
            circle at 10% 75%,
            rgba(211,71,135,.07),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 60%,
            rgba(72,76,180,.08),
            transparent 32%
        ),

        linear-gradient(
            180deg,
            #03030a 0%,
            #070512 35%,
            #0c0717 70%,
            #03030a 100%
        );
}


/* =========================================================
   AURORA
========================================================= */

.aurora{

    position:absolute;

    width:140%;
    height:45%;

    left:-20%;
    bottom:-12%;

    border-radius:50%;

    background:

        radial-gradient(
            ellipse,
            rgba(163,80,170,.08),
            transparent 68%
        );

    filter:blur(45px);

    animation:
        auroraMove
        16s
        ease-in-out
        infinite alternate;
}


@keyframes auroraMove{

    from{
        transform:
            translateX(-5%)
            scale(1);
    }

    to{
        transform:
            translateX(5%)
            scale(1.12);
    }
}


/* =========================================================
   STARS
========================================================= */

.star{

    position:absolute;

    border-radius:50%;

    background:#fff;

    opacity:.3;

    box-shadow:
        0 0 5px rgba(255,255,255,.8),
        0 0 12px rgba(220,205,255,.25);

    animation:
        starTwinkle
        var(--time)
        ease-in-out
        infinite alternate;

}


@keyframes starTwinkle{

    0%{
        opacity:.12;
        transform:scale(.55);
    }

    50%{
        opacity:.55;
    }

    100%{
        opacity:1;
        transform:scale(1.5);
    }
}


/* =========================================================
   SPECIAL STARS
========================================================= */

.special-star{

    position:absolute;

    width:4px;
    height:4px;

    background:white;

    border-radius:50%;

    box-shadow:
        0 0 7px white,
        0 0 20px rgba(220,210,255,.8);

    animation:
        specialTwinkle
        3s
        ease-in-out
        infinite;
}


.special-star::before,
.special-star::after{

    content:"";

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:
        linear-gradient(
            transparent,
            rgba(255,255,255,.8),
            transparent
        );
}


.special-star::before{

    width:1px;
    height:25px;
}


.special-star::after{

    width:25px;
    height:1px;
}


@keyframes specialTwinkle{

    0%,100%{
        opacity:.25;
        transform:scale(.7);
    }

    50%{
        opacity:1;
        transform:scale(1.3);
    }
}


/* =========================================================
   MOON AURA
========================================================= */

.moon-aura{

    position:fixed;

    z-index:2;

    top:-20px;

    left:50%;

    width:
        clamp(
            220px,
            58vw,
            330px
        );

    height:
        clamp(
            220px,
            58vw,
            330px
        );

    transform:translateX(-50%);

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(255,226,176,.20),
            rgba(255,218,170,.08) 35%,
            transparent 70%
        );

    filter:blur(18px);

    animation:
        moonGlow
        7s
        ease-in-out
        infinite;
}


@keyframes moonGlow{

    0%,100%{
        opacity:.55;
        transform:
            translateX(-50%)
            scale(.94);
    }

    50%{
        opacity:1;
        transform:
            translateX(-50%)
            scale(1.08);
    }
}


/* =========================================================
   CRESCENT
========================================================= */

.moon{

    position:fixed;

    z-index:3;

    top:7%;

    left:50%;

    width:
        clamp(
            78px,
            22vw,
            125px
        );

    height:
        clamp(
            78px,
            22vw,
            125px
        );

    transform:translateX(-50%);

    border-radius:50%;

    background:

        radial-gradient(
            circle at 35% 32%,
            #fffef5,
            #fff2d0 55%,
            #e8c98f 100%
        );

    box-shadow:

        0 0 18px rgba(255,245,214,.95),

        0 0 50px rgba(255,220,165,.55),

        0 0 100px rgba(255,200,140,.20);

    animation:
        moonFloat
        7s
        ease-in-out
        infinite;
}


.moon::after{

    content:"";

    position:absolute;

    width:100%;
    height:100%;

    top:-9px;
    right:-25px;

    border-radius:50%;

    background:#080511;

}


@keyframes moonFloat{

    0%,100%{
        transform:
            translateX(-50%)
            translateY(0);
    }

    50%{
        transform:
            translateX(-50%)
            translateY(-7px);
    }
}



/* =========================================================
   ROMANTIC CINEMATIC POEM — ULTRA
   ========================================================= */

/* The poem scene is initially untouched. */
.moon{
    transform-origin:50% 50%;
}

/* A soft halo trails the moon while it descends. */
.moon::before{
    content:"";
    position:absolute;
    inset:-55%;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            rgba(255,244,210,.24) 0%,
            rgba(255,210,160,.11) 30%,
            rgba(255,180,150,.035) 53%,
            transparent 72%
        );
    filter:blur(12px);
    opacity:.65;
    pointer-events:none;
    transform:scale(.86);
    transition:
        opacity 3.5s ease,
        transform 4.5s cubic-bezier(.16,1,.3,1);
}

/* Cinematic descent + elegant crescent transformation. */
body.poem-moon .moon{
    animation:romanticMoonDescent 5.2s cubic-bezier(.16,1,.3,1) forwards;
    filter:
        drop-shadow(0 0 15px rgba(255,248,220,.9))
        drop-shadow(0 0 38px rgba(255,215,165,.45))
        drop-shadow(0 0 90px rgba(255,185,150,.18));
}

body.poem-moon .moon::before{
    opacity:.9;
    transform:scale(1.08);
}

body.poem-moon .moon::after{
    opacity:1;
    top:-9px;
    right:-25px;
    transform:scale(1.02);
    transition:
        opacity 2.4s ease 1.15s,
        transform 3.6s cubic-bezier(.16,1,.3,1) 1.15s;
}

@keyframes romanticMoonDescent{
    0%{
        top:7%;
        transform:
            translateX(-50%)
            translateY(0)
            scale(1)
            rotate(0deg);
    }
    18%{
        transform:
            translateX(-50%)
            translateY(4px)
            scale(.98)
            rotate(-1deg);
    }
    48%{
        top:35%;
        transform:
            translateX(-50%)
            translateY(-2px)
            scale(.88)
            rotate(-3deg);
    }
    74%{
        top:55%;
        transform:
            translateX(-50%)
            translateY(2px)
            scale(.78)
            rotate(-5deg);
    }
    100%{
        top:68%;
        transform:
            translateX(-50%)
            translateY(-50%)
            scale(.70)
            rotate(-7deg);
    }
}

/* =========================================================
   ROMANTIC PARTICLES
   ========================================================= */

body.poem-moon::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    opacity:0;
    background:
        radial-gradient(circle at 18% 70%, rgba(255,220,190,.16) 0 1px, transparent 2px),
        radial-gradient(circle at 73% 58%, rgba(255,240,215,.13) 0 1px, transparent 2px),
        radial-gradient(circle at 42% 82%, rgba(255,210,190,.12) 0 1px, transparent 2px),
        radial-gradient(circle at 84% 30%, rgba(255,245,220,.13) 0 1px, transparent 2px);
    background-size:130px 170px, 190px 210px, 160px 190px, 220px 230px;
    animation:
        romanticParticles 7s ease-in-out forwards,
        romanticParticlesDrift 12s linear infinite;
}

@keyframes romanticParticles{
    0%{opacity:0;transform:scale(.94);}
    30%{opacity:.72;}
    100%{opacity:.38;transform:scale(1.03);}
}

@keyframes romanticParticlesDrift{
    0%{background-position:0 0, 0 0, 0 0, 0 0;}
    50%{background-position:18px -28px, -24px -20px, 14px -35px, -18px -24px;}
    100%{background-position:36px -56px, -48px -40px, 28px -70px, -36px -48px;}
}

/* A subtle warm vignette makes the poem feel intimate. */
body.poem-moon::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
        radial-gradient(
            ellipse at 50% 58%,
            transparent 22%,
            rgba(8,5,17,.10) 55%,
            rgba(3,2,9,.42) 100%
        );
    opacity:0;
    animation:romanticVignette 5s ease forwards;
}

@keyframes romanticVignette{
    from{opacity:0;}
    to{opacity:1;}
}

/* =========================================================
   HEART REPLACEMENT — NO EXPLOSION
   ========================================================= */

/*
   Instead of an exploding heart, the scene now uses a
   gentle "heart bloom": a small heart appears, breathes,
   releases a few glowing particles, and fades softly.
*/
.heart{
    animation:none !important;
    transform-origin:center;
}

body.poem-moon .heart{
    animation:
        heartBloom 3.8s cubic-bezier(.16,1,.3,1) forwards,
        heartBreath 2.8s ease-in-out 3.8s infinite !important;
}

@keyframes heartBloom{
    0%{
        opacity:0;
        transform:translateY(20px) scale(.35) rotate(-8deg);
        filter:blur(5px);
    }
    38%{
        opacity:1;
        transform:translateY(0) scale(1.08) rotate(2deg);
        filter:blur(0);
    }
    62%{
        transform:translateY(-3px) scale(.94) rotate(-1deg);
    }
    100%{
        opacity:1;
        transform:translateY(0) scale(1) rotate(0);
        filter:
            drop-shadow(0 0 10px rgba(255,190,190,.6))
            drop-shadow(0 0 28px rgba(255,150,170,.22));
    }
}

@keyframes heartBreath{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.045);
    }
}

/* Soft heart-like glow around the existing heart, not an explosion. */
.heart::before{
    content:"";
    position:absolute;
    inset:-28px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        rgba(255,180,195,.18),
        rgba(255,150,180,.05) 42%,
        transparent 72%
    );
    opacity:0;
    transform:scale(.6);
    pointer-events:none;
}

body.poem-moon .heart::before{
    animation:
        heartAura 4.2s ease forwards,
        heartAuraBreath 3s ease-in-out 4.2s infinite;
}

@keyframes heartAura{
    0%{opacity:0;transform:scale(.6);}
    45%{opacity:.9;transform:scale(1);}
    100%{opacity:.58;transform:scale(1.12);}
}

@keyframes heartAuraBreath{
    0%,100%{transform:scale(1.12);}
    50%{transform:scale(1.2);}
}

/* =========================================================
   POEM TRANSITION — SOFT CINEMATIC REVEAL
   ========================================================= */

body.poem-moon #typing{
    animation:
        poemArrival 2.8s cubic-bezier(.16,1,.3,1) both;
}

@keyframes poemArrival{
    0%{
        opacity:0;
        transform:translateY(18px);
        filter:blur(8px);
    }
    55%{
        opacity:.7;
        filter:blur(2px);
    }
    100%{
        opacity:1;
        transform:translateY(0);
        filter:blur(0);
    }
}

/* Let the cursor feel like a soft candle rather than a harsh blink. */
body.poem-moon #cursor{
    animation:
        romanticCursor 1.35s ease-in-out infinite;
}

@keyframes romanticCursor{
    0%,100%{opacity:.25;}
    50%{opacity:1;}
}

/* =========================================================
   RESPONSIVE CINEMATIC VERSION
   ========================================================= */

@media(max-height:700px){
    @keyframes romanticMoonDescent{
        0%{
            top:5%;
            transform:translateX(-50%) scale(.9) rotate(0);
        }
        45%{
            top:38%;
            transform:translateX(-50%) scale(.76) rotate(-4deg);
        }
        100%{
            top:66%;
            transform:translateX(-50%) translateY(-50%) scale(.60) rotate(-7deg);
        }
    }
}

/* =========================================================
   METEORS
========================================================= */

.meteor{

    position:fixed;

    z-index:4;

    top:-10%;

    left:-15%;

    width:var(--length);

    height:2px;

    border-radius:50%;

    opacity:0;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,220,180,.2),
            rgba(255,245,225,.95)
        );

    box-shadow:
        0 0 8px rgba(255,220,180,.8),
        0 0 18px rgba(255,170,120,.25);

    transform:rotate(32deg);

    animation:
        meteor
        var(--duration)
        linear
        infinite;

}


@keyframes meteor{

    0%{

        opacity:0;

        transform:
            translate(-20vw,-20vh)
            rotate(32deg);
    }

    5%{
        opacity:1;
    }

    32%{

        opacity:1;

        transform:
            translate(75vw,70vh)
            rotate(32deg);
    }

    36%{
        opacity:0;
    }

    100%{
        opacity:0;
    }
}


/* =========================================================
   PAGE
========================================================= */

.page{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    min-height:100dvh;

    z-index:10;

    display:none;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    text-align:center;

    padding:
        max(25px,env(safe-area-inset-top))
        22px
        max(25px,env(safe-area-inset-bottom))
        22px;

    overflow:hidden;

    opacity:0;

    transform-style:preserve-3d;

    transform-origin:center 70%;

    transform:
        scale(1.02)
        rotateX(2deg)
        translateY(8px);

    filter:blur(8px);

    transition:

        opacity
        1.3s
        cubic-bezier(.4,0,.2,1),

        transform
        1.4s
        cubic-bezier(.4,0,.2,1),

        filter
        1.3s
        cubic-bezier(.4,0,.2,1);
}


.page.active{

    display:flex;

    opacity:1;

    transform:
        scale(1)
        rotateX(0deg)
        translateY(0);

    filter:blur(0);
}


.page.fade-out{

    opacity:0;

    transform:
        scale(.985)
        rotateX(-2deg)
        translateY(-8px);

    filter:blur(9px);
}


/* =========================================================
   PAGE INNER LIGHT
========================================================= */

.page::before{

    content:"";

    position:absolute;

    inset:0;

    background:

        radial-gradient(
            circle at 50% 45%,
            rgba(255,255,255,.025),
            transparent 42%
        );

    pointer-events:none;
}


/* =========================================================
   CONTENT
========================================================= */

.content{

    position:relative;

    z-index:20;

    width:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;
}


/* =========================================================
   PROGRESS DOTS
========================================================= */

.progress{

    position:fixed;

    left:50%;

    bottom:
        max(16px,env(safe-area-inset-bottom));

    transform:translateX(-50%);

    z-index:60;

    display:flex;

    gap:9px;

    padding:8px 14px;

    border-radius:30px;

    background:
        rgba(255,255,255,.05);

    border:
        1px solid
        rgba(255,255,255,.08);

    backdrop-filter:
        blur(14px);

    -webkit-backdrop-filter:
        blur(14px);

    pointer-events:none;

    opacity:.85;

    transition:
        opacity .4s ease;
}


.progress .dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:
        rgba(255,255,255,.28);

    transition:
        all .5s
        cubic-bezier(.22,1,.36,1);
}


.progress .dot.on{

    width:20px;

    background:
        linear-gradient(
            90deg,
            #ffd8e8,
            #ff9ec8
        );

    box-shadow:
        0 0 10px rgba(255,140,190,.7);
}


/* =========================================================
   HEADINGS
========================================================= */

h2{

    margin:10px 0;

    max-width:92%;

    font-size:
        clamp(
            24px,
            7vw,
            36px
        );

    line-height:1.8;

    font-weight:600;

    color:#fff;

    text-shadow:
        0 4px 30px rgba(255,150,200,.25);

    animation:
        gentleText
        4s
        ease-in-out
        infinite;
}


@keyframes gentleText{

    0%,100%{
        text-shadow:
            0 4px 30px
            rgba(255,150,200,.18);
    }

    50%{
        text-shadow:
            0 4px 40px
            rgba(255,150,200,.38);
    }
}


p{

    max-width:90%;

    margin:12px 0;

    font-size:
        clamp(
            17px,
            4.6vw,
            23px
        );

    line-height:2;

    color:
        rgba(255,245,250,.9);
}


/* =========================================================
   RANDOM CARD
========================================================= */

.random-love{

    position:relative;

    width:min(92%,450px);

    min-height:90px;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:18px 20px;

    margin:12px 0;

    border-radius:28px;

    background:

        linear-gradient(
            135deg,
            rgba(255,255,255,.08),
            rgba(255,120,180,.035)
        );

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    box-shadow:

        0 25px 70px
        rgba(0,0,0,.3),

        inset 0 1px 0
        rgba(255,255,255,.08);

    color:
        rgba(255,245,250,.95);

    font-size:
        clamp(
            14px,
            4vw,
            18px
        );

    line-height:1.9;

    animation:
        cardAppear
        1.5s
        cubic-bezier(.16,1,.3,1);
}


.random-love::before{

    content:"♡";

    position:absolute;

    top:-17px;

    right:20px;

    font-size:29px;

    color:
        rgba(255,170,205,.7);
}


@keyframes cardAppear{

    from{

        opacity:0;

        transform:
            scale(.90);

        filter:blur(9px);
    }

    to{

        opacity:1;

        transform:
            scale(1);

        filter:blur(0);
    }
}


/* =========================================================
   BUTTON
========================================================= */

button{

    position:relative;

    z-index:30;

    min-width:140px;

    padding:
        15px 40px;

    margin:15px;

    border-radius:50px;

    border:
        1px solid
        rgba(255,255,255,.15);

    background:

        linear-gradient(
            135deg,
            rgba(255,255,255,.11),
            rgba(255,100,165,.07)
        );

    color:white;

    font-family:inherit;

    font-size:16px;

    cursor:pointer;

    overflow:hidden;

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    box-shadow:

        0 15px 45px
        rgba(0,0,0,.3),

        inset 0 1px 0
        rgba(255,255,255,.08);

    transition:
        transform .3s ease,
        background .3s ease,
        box-shadow .3s ease;
}


button::after{

    content:"";

    position:absolute;

    inset:0;

    border-radius:inherit;

    background:
        radial-gradient(
            circle at var(--mx,50%) var(--my,50%),
            rgba(255,255,255,.35),
            transparent 45%
        );

    opacity:0;

    transition:opacity .4s ease;

    pointer-events:none;
}


button:hover::after{
    opacity:1;
}


button:hover{

    transform:
        scale(1.06);

    background:
        rgba(255,100,165,.12);

    box-shadow:
        0 20px 55px
        rgba(255,80,150,.15);
}


button:active{

    transform:
        scale(.92);
}


/* =========================================================
   HEART
========================================================= */

.big-heart{

    position:relative;

    z-index:30;

    font-size:
        clamp(
            82px,
            25vw,
            125px
        );

    cursor:pointer;

    user-select:none;

    filter:
        drop-shadow(
            0 15px 35px
            rgba(255,40,120,.3)
        );

    animation:
        heartbeat
        1.8s
        ease-in-out
        infinite;

    transition:
        .6s
        cubic-bezier(.16,1,.3,1);
}


.big-heart::before{

    content:"";

    position:absolute;

    inset:-30px;

    border-radius:50%;

    background:
        rgba(255,70,150,.08);

    filter:blur(30px);

    z-index:-1;

    animation:
        heartAura
        2s
        ease-in-out
        infinite;
}


@keyframes heartbeat{

    0%,100%{
        transform:scale(1);
    }

    15%{
        transform:scale(1.10);
    }

    30%{
        transform:scale(1);
    }

    45%{
        transform:scale(1.13);
    }

    60%{
        transform:scale(1);
    }
}


@keyframes heartAura{

    0%,100%{
        opacity:.25;
        transform:scale(.8);
    }

    50%{
        opacity:.8;
        transform:scale(1.2);
    }
}


/* =========================================================
   POEM
========================================================= */

#typing{
    width:min(92%,560px);
    max-height:55vh;
    overflow-y:auto;
    padding:18px 22px;
    border-radius:18px;
    text-align:right;
    white-space:normal;
    font-size:clamp(15px,4vw,20px);
    line-height:1.75;
    letter-spacing:0;
    word-spacing:0;
    color:rgba(255,248,252,.97);
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.08),
            rgba(255,110,170,.035)
        );
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
    box-shadow:
        0 30px 80px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.08);
    animation:poemAppear 1.5s cubic-bezier(.16,1,.3,1);
}


#typing::-webkit-scrollbar{
    display:none;
}


.cursor{

    display:inline-block;

    margin-inline-start:2px;

    color:rgba(255,190,215,.95);

    animation:
        cursorBlink
        .85s
        steps(1)
        infinite;
}


@keyframes cursorBlink{

    0%,49%{
        opacity:1;
    }

    50%,100%{
        opacity:0;
    }
}


@keyframes poemAppear{

    from{

        opacity:0;

        transform:
            scale(.91);

        filter:blur(10px);
    }

    to{

        opacity:1;

        transform:
            scale(1);

        filter:blur(0);
    }
}


/* =========================================================
   FEW HEARTS
========================================================= */

.heart{

    position:fixed;

    z-index:6;

    pointer-events:none;

    opacity:0;

    animation:
        floatHeart
        var(--duration)
        linear
        infinite;
}


@keyframes floatHeart{

    0%{
        transform:
            translateY(0)
            scale(.6);

        opacity:0;
    }

    20%{
        opacity:.25;
    }

    55%{
        opacity:.35;

        transform:
            translateY(-55vh)
            translateX(15px)
            scale(.9);
    }

    100%{

        transform:
            translateY(-120vh)
            translateX(-15px)
            scale(1.1);

        opacity:0;
    }
}


/* =========================================================
   EXPLOSION
========================================================= */

.particle{

    position:fixed;

    z-index:100;

    pointer-events:none;

    font-size:
        var(--size);

    animation:
        explode
        1.5s
        cubic-bezier(.16,1,.3,1)
        forwards;
}


@keyframes explode{

    0%{

        opacity:1;

        transform:
            translate(0,0)
            scale(.3)
            rotate(0deg);
    }

    100%{

        opacity:0;

        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(1.5)
            rotate(60deg);
    }
}


/* =========================================================
   FINAL SCREEN
========================================================= */

.final-content{

    position:relative;

    z-index:40;

    width:min(94%,500px);

    display:flex;

    flex-direction:column;

    align-items:center;
}


/* Final ornament */

.final-symbol{

    font-size:25px;

    color:
        rgba(255,220,235,.8);

    letter-spacing:10px;

    margin-bottom:20px;

    animation:
        symbolGlow
        3s
        ease-in-out
        infinite;
}


@keyframes symbolGlow{

    0%,100%{
        opacity:.4;
        transform:scale(.95);
    }

    50%{
        opacity:1;
        transform:scale(1.05);
    }
}


/* =========================================================
   FINAL TWO LINES
========================================================= */

#finalMessage{

    width:100%;

    padding:
        25px 20px;

    border-radius:30px;

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.09),
            rgba(255,120,175,.045)
        );

    border:
        1px solid
        rgba(255,255,255,.14);

    backdrop-filter:
        blur(28px);

    -webkit-backdrop-filter:
        blur(28px);

    box-shadow:

        0 30px 90px
        rgba(0,0,0,.42),

        inset 0 1px 0
        rgba(255,255,255,.09);

    font-size:
        clamp(
            17px,
            4.8vw,
            23px
        );

    line-height:2.2;

    color:#fff;

    animation:
        finalAppear
        2s
        cubic-bezier(.16,1,.3,1)
        forwards;
}


@keyframes finalAppear{

    from{

        opacity:0;

        transform:
            scale(.88);

        filter:blur(12px);
    }

    to{

        opacity:1;

        transform:
            scale(1);

        filter:blur(0);
    }
}


/* =========================================================

.final-heart{

    margin-top:25px;

        finalHeart

@keyframes finalHeart{

<style id="romantic-polish">

   SECRET LETTER — CINEMATIC EDITION
========================================================= */

#heart{
  position:relative;
  width:132px;

  isolation:isolate;
  border-radius:14px;
  background:
    linear-gradient(145deg,

  box-shadow:
    0 18px 45px rgba(0,0,0,.24),

  transform:rotate(-1deg);

    transform .65s cubic-bezier(.16,1,.3,1),
    box-shadow .65s ease;
}

/* envelope flap */
#heart::before{
  content:"";
  position:absolute;
  z-index:3;
  left:5px;
  right:5px;
  top:5px;
  height:57px;
  background:
    linear-gradient(135deg,
      transparent 49.3%,
      rgba(255,255,255,.82) 50%,
      transparent 50.8%),
    linear-gradient(225deg,
      transparent 49.3%,
      rgba(255,255,255,.58) 50%,
      transparent 50.8%);
  clip-path:polygon(0 0,50% 63%,100% 0,100% 100%,0 100%);
  transform-origin:top center;
  filter:drop-shadow(0 2px 4px rgba(110,50,75,.10));
}

/* inner letter */
#heart .letter-paper{
  position:absolute;
  z-index:2;
  left:50%;
  bottom:7px;
  width:72%;
  height:62%;
  transform:translateX(-50%) translateY(20%);
  border-radius:5px;
  background:
    linear-gradient(180deg,#fffdfb,#f8edf1);
  box-shadow:0 5px 14px rgba(92,46,65,.13);
  opacity:.82;
}

/* wax seal */
#heart::after{
  content:"✦";
  position:absolute;
  z-index:5;
  left:50%;
  top:54%;
  width:30px;
  height:30px;
  transform:translate(-50%,-50%);
  display:grid;
  place-items:center;
  border-radius:50%;
  color:#fff8fb;
  font-size:13px;
  background:

  box-shadow:
    0 5px 17px rgba(110,54,78,.24),
    0 0 20px rgba(255,190,215,.25);
}

#heart:hover{
  transform:translateY(-7px) rotate(0deg) scale(1.045);
  box-shadow:
    0 24px 58px rgba(0,0,0,.28),
    0 0 48px rgba(255,190,215,.36);
}

/* gentle floating */
#heart:not(.letter-open){
  animation:letterFloat 4s ease-in-out infinite;
}

@keyframes letterFloat{
  0%,100%{transform:translateY(0) rotate(-1deg)}
  50%{transform:translateY(-6px) rotate(1deg)}
}

/* opening sequence */
#heart.letter-open{
  animation:letterOpenCinematic 1.25s cubic-bezier(.16,1,.3,1) forwards;
}

#heart.letter-open::before{
  animation:flapOpenCinematic .90s cubic-bezier(.16,1,.3,1) forwards;
}

#heart.letter-open .letter-paper{
  animation:paperRise 1.05s cubic-bezier(.16,1,.3,1) forwards;
}

#heart.letter-open::after{
  animation:sealFade 1s ease forwards;
}

@keyframes letterOpenCinematic{
  0%{
    transform:translateY(0) rotate(-1deg) scale(1);
  }
  25%{
    transform:translateY(-9px) rotate(1deg) scale(1.06);
  }
  55%{
    transform:translateY(-4px) rotate(-.5deg) scale(1.035);
  }
  100%{
    transform:translateY(0) rotate(0) scale(.94);
    opacity:.15;
  }
}

@keyframes flapOpenCinematic{
  0%{transform:rotateX(0);opacity:1}
  50%{transform:rotateX(72deg);opacity:.92}
  100%{transform:rotateX(120deg);opacity:.18}
}

@keyframes paperRise{
  0%{
    transform:translateX(-50%) translateY(20%);
    opacity:.82;
  }
  45%{
    transform:translateX(-50%) translateY(-28%);
    opacity:1;
  }
  100%{
    transform:translateX(-50%) translateY(-58%) scale(1.03);
    opacity:0;
    filter:blur(2px);
  }
}

@keyframes sealFade{
  0%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  55%{opacity:.55;transform:translate(-50%,-50%) scale(1.35)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(.25)}

/* atmospheric light when the letter opens */
.letter-opening-light{

  0%{

  15%{opacity:1}
  55%{
    opacity:.6;
    transform:scale(12);
  }

function getRandomSentence(){

    const last=
        localStorage.getItem(
            "lastLoveSentence"
        );

    let available=
        loveSentences.filter(
            sentence =>
            sentence !== last
        );

    if(available.length===0){

        available=
            [...loveSentences];
    }

    const sentence=
        available[
            Math.floor(
                Math.random()*
                available.length
            )
        ];

    localStorage.setItem(
        "lastLoveSentence",
        sentence
    );

    return sentence;
}

/* =========================================================
   PROGRESS DOTS UPDATE
========================================================= */

const pageOrder=["p1","p2","p3","p4","p5","p6"];

function updateProgress(pageId){

    const idx=
        pageOrder.indexOf(pageId);

    document
        .querySelectorAll(".progress .dot")
        .forEach((dot,i)=>{

            dot.classList.toggle(
                "on",
                i<=idx
            );
        });
}

updateProgress("p1");


/* =========================================================
   PAGE TRANSITION
========================================================= */

function go(from,to){
    const oldPage=document.getElementById(from);
    const newPage=document.getElementById(to);
    if(!oldPage || !newPage || oldPage===newPage) return;
    oldPage.classList.add("fade-out");
    updateProgress(to);
    setTimeout(()=>{
        oldPage.classList.remove("active","fade-out");
        newPage.classList.add("active");
    },720);
}

function continueJourney(){
    cinematicFlash();
    go("p1","p2");
}

function skipToPoem(){
    cinematicFlash();
    document.body.classList.add("fast-route");
    const oldPage=document.getElementById("p1");
    const poemPage=document.getElementById("p5");
    oldPage.classList.add("fade-out");
    updateProgress("p5");
    selectPoem();
    setTimeout(()=>{
        oldPage.classList.remove("active","fade-out");
        poemPage.classList.add("active");
        startRomantic();
    },620);
}

const memoryOrbit=document.getElementById("memoryOrbit");
function openMemoryPortal(){
    if(!memoryOrbit || memoryOrbit.dataset.opened === "1") return;
    memoryOrbit.dataset.opened="1";
    memoryOrbit.classList.add("portal-open");
    const rect=memoryOrbit.getBoundingClientRect();
    const burst=document.createElement("div");
    burst.className="memory-burst";
    burst.style.left=(rect.left+rect.width/2)+"px";
    burst.style.top=(rect.top+rect.height/2)+"px";
    document.body.appendChild(burst);
    setTimeout(()=>burst.remove(),1600);
    setTimeout(()=>{
        selectPoem();
        go("p4","p5");
        setTimeout(startRomantic,520);
    },900);
}
if(memoryOrbit){
    memoryOrbit.addEventListener("click",openMemoryPortal);
    memoryOrbit.addEventListener("keydown",e=>{
        if(e.key==="Enter" || e.key===" "){e.preventDefault();openMemoryPortal();}
    });
}

let currentPoem=
    poems[0];


function selectPoem(){

    const last=
        localStorage.getItem(
            "lastPoem"
        );


    let available=
        poems.filter(
            p => p !== last
        );


    if(
        available.length===0
    ){

        available=
            [...poems];
    }


    const selected=
        available[
            Math.floor(
                Math.random()*
                available.length
            )
        ];


    localStorage.setItem(
        "lastPoem",
        selected
    );


    currentPoem=
        selected;
}


selectPoem();


/* =========================================================
   MUSIC + TYPING
========================================================= */

const music=
    document.getElementById(
        "music"
    );


let typingIndex=0;



function startRomantic(){

    /* Cinematic moon descent begins at the exact moment
       the poem starts typing. */
    document.body.classList.remove("poem-moon");
    void document.body.offsetWidth;
    document.body.classList.add("poem-moon");
    document.body.classList.add("romantic-scene");



    const typedText=
        document.getElementById(
            "typedText"
        );

    const cursor=
        document.getElementById(
            "cursor"
        );


    typedText.textContent="";

    cursor.style.display=
        "inline-block";


    typingIndex=0;


    /* تشغيل الأغنية */

    music.volume=0;

    music.play().catch(()=>{});


    let volume=0;


    const fadeMusic=
        setInterval(()=>{

            volume+=.025;

            if(volume>=.65){

                volume=.65;

                clearInterval(
                    fadeMusic
                );
            }

            music.volume=
                volume;

        },100);


    /* كتابة الرسالة حرف حرف */

    const interval=
        setInterval(()=>{

            typingIndex++;
            typedText.textContent=currentPoem.slice(0,typingIndex);
            typedText.classList.remove("ink-pulse");
            void typedText.offsetWidth;
            typedText.classList.add("ink-pulse");


            const typingBox=
                document.getElementById(
                    "typing"
                );

            typingBox.scrollTop=
                typingBox.scrollHeight;


            if(
                typingIndex>=
                currentPoem.length
            ){

                clearInterval(
                    interval
                );

                cursor.style.display=
                    "none";


                setTimeout(()=>{

                    prepareFinal();

                    go(
                        "p5",
                        "p6"
                    );

                },1050);
            }

        },145);
}

/* =========================================================
   FINAL MESSAGE SELECTION
========================================================= */

function prepareFinal(){

    const last=
        localStorage.getItem(
            "lastFinalMessage"
        );


    let available=
        finalMessages.filter(
            pair =>
            pair.join("|") !== last
        );


    if(
        available.length===0
    ){

        available=
            [...finalMessages];
    }


    const selected=
        available[
            Math.floor(
                Math.random()*
                available.length
            )
        ];


    const key=
        selected.join("|");


    localStorage.setItem(
        "lastFinalMessage",
        key
    );


    const final=
        document.getElementById(
            "finalMessage"
        );


    /*
       سطران فقط
    */

    final.innerHTML=
        selected[0]+
        "<br>"+
        selected[1];
}

<div id="routeTransition" aria-hidden="true"></div>

<script id="reliable-navigation-3d">
(function(){
  "use strict";

  const order = ["p1","p2","p3","p4","p5","p6"];
  let locked = false;
  let activeId = document.querySelector(".page.active")?.id || "p1";

  function page(id){ return document.getElementById(id); }

  function setScene(id){
    document.body.classList.remove(...order.map(x=>"scene-"+x));
    document.body.classList.add("scene-"+id);
    document.body.dataset.currentPage = id;
  }

  function flash(){
    const layer = document.getElementById("routeTransition");
    if(!layer) return;
    layer.classList.remove("play");
    void layer.offsetWidth;
    layer.classList.add("play");
    setTimeout(()=>layer.classList.remove("play"),900);
  }

  function progress(id){
    const i = order.indexOf(id);
    document.querySelectorAll(".progress .dot").forEach((dot,n)=>{
      dot.classList.toggle("on", n <= i);
    });
  }

  window.go = function(from,to){
    const oldPage = page(from) || page(activeId);
    const newPage = page(to);
    if(!newPage || oldPage === newPage || locked) return false;

    locked = true;
    const fromIndex = order.indexOf(oldPage?.id || activeId);
    const toIndex = order.indexOf(to);

    oldPage?.classList.remove("route-show");
    oldPage?.classList.add("route-leave");

    newPage.classList.remove("active","fade-out","route-show","route-leave",
      "route-enter-right","route-enter-left","route-enter-depth","route-enter-final");

    let enterClass = "route-enter-right";
    if(toIndex < fromIndex) enterClass = "route-enter-left";
    if(to === "p5") enterClass = "route-enter-depth";
    if(to === "p6") enterClass = "route-enter-final";

    newPage.classList.add(enterClass);
    newPage.classList.add("active");
    setScene(to);
    progress(to);
    flash();

    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        newPage.classList.remove(enterClass);
        newPage.classList.add("route-show");
      });
    });

    setTimeout(()=>{
      oldPage?.classList.remove("active","fade-out","route-leave","route-show");
      newPage.classList.remove("route-show");
      newPage.classList.add("active");
      activeId = to;
      locked = false;
    },1150);

    return true;
  };

  window.continueJourney = function(){
    return window.go("p1","p2");
  };

  window.skipToPoem = function(){
    document.body.classList.add("fast-route");
    if(typeof window.selectPoem === "function") window.selectPoem();

    const moved = window.go("p1","p5");
    if(moved){
      setTimeout(()=>{
        if(typeof window.startRomantic === "function") window.startRomantic();
      },650);
    }
    return moved;
  };

  /* Remove broken/duplicate inline handlers and bind everything directly. */
  document.querySelectorAll("[onclick]").forEach(el=>el.removeAttribute("onclick"));

  const bind = (selector, fn) => {
    document.querySelectorAll(selector).forEach(el=>{
      el.addEventListener("click", e=>{
        e.preventDefault();
        e.stopPropagation();
        fn(e);
      });
    });
  };

  bind("#p1 .nav-duo button:first-child", window.continueJourney);
  bind("#p1 .nav-duo .shortcut", window.skipToPoem);
  bind("#p2 button", ()=>window.go("p2","p3"));
  bind("#p3 button", ()=>window.go("p3","p4"));

  /* Re-bind the memory portal without touching its existing visual code. */
  const orbit = document.getElementById("memoryOrbit");
  if(orbit){
    const cleanOrbit = orbit.cloneNode(true);
    orbit.replaceWith(cleanOrbit);
    cleanOrbit.addEventListener("click", e=>{
      e.preventDefault();
      e.stopPropagation();
      if(cleanOrbit.dataset.opened === "1") return;
      cleanOrbit.dataset.opened = "1";
      cleanOrbit.classList.add("portal-open");

      const r = cleanOrbit.getBoundingClientRect();
      const burst = document.createElement("div");
      burst.className = "memory-burst";
      burst.style.left = (r.left+r.width/2)+"px";
      burst.style.top = (r.top+r.height/2)+"px";
      document.body.appendChild(burst);
      setTimeout(()=>burst.remove(),1600);

      setTimeout(()=>{
        if(typeof window.selectPoem === "function") window.selectPoem();
        const moved = window.go("p4","p5");
        if(moved){
          setTimeout(()=>{
            if(typeof window.startRomantic === "function") window.startRomantic();
          },650);
        }
      },520);
    });
    cleanOrbit.addEventListener("keydown", e=>{
      if(e.key==="Enter" || e.key===" "){
        e.preventDefault();
        cleanOrbit.click();
      }
    });
  }

  /* Add a small always-visible route hint on touch devices. */
  document.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("pointerdown",()=>{
      btn.style.setProperty("--press","1");
    });
    btn.addEventListener("pointerup",()=>{
      btn.style.removeProperty("--press");
    });
  });

  /* Initial scene */
  setScene(activeId);
  progress(activeId);

})();
</script>


<style id="luxury-atmosphere">
/* =========================================================
   LUXURY CINEMATIC ATMOSPHERE
========================================================= */
body{
  overflow:hidden;
  background:#030208 !important;
}
body::before{
  content:"";
  position:fixed;
  inset:-25%;
  z-index:-4;
  pointer-events:none;
  background:
    radial-gradient(circle at 20% 20%,rgba(255,120,190,.13),transparent 24%),
    radial-gradient(circle at 80% 70%,rgba(125,95,255,.12),transparent 28%);
  animation:ambientDrift 18s ease-in-out infinite alternate;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-3;
  pointer-events:none;
  background:
    linear-gradient(115deg,transparent 0 43%,rgba(255,255,255,.025) 50%,transparent 57%);
  background-size:260% 260%;
  animation:silkMove 13s ease-in-out infinite;
}
@keyframes ambientDrift{
  0%{transform:translate3d(-2%,-1%,0) scale(1)}
  100%{transform:translate3d(3%,2%,0) scale(1.12)}
}
@keyframes silkMove{
  0%,100%{background-position:0% 50%;opacity:.25}
  50%{background-position:100% 50%;opacity:.7}
}

/* Different cinematic background per page */
body.scene-p1{
  --scene-a:#ff77b7;--scene-b:#7f63ff;--scene-c:#080412;
}
body.scene-p2{
  --scene-a:#ffd68a;--scene-b:#4c8dff;--scene-c:#020614;
}
body.scene-p3{
  --scene-a:#ff76b7;--scene-b:#a66dff;--scene-c:#09030d;
}
body.scene-p4{
  --scene-a:#73d7ff;--scene-b:#b47aff;--scene-c:#030711;
}
body.scene-p5{
  --scene-a:#ffbd8a;--scene-b:#ff6da9;--scene-c:#08030a;
}
body.scene-p6{
  --scene-a:#ffd5eb;--scene-b:#b18cff;--scene-c:#05020a;
}

body.scene-p1 .sky,
body.scene-p2 .sky,
body.scene-p3 .sky,
body.scene-p4 .sky,
body.scene-p5 .sky,
body.scene-p6 .sky{
  background:
    radial-gradient(circle at 50% 20%,color-mix(in srgb,var(--scene-a) 24%,transparent),transparent 25%),
    radial-gradient(circle at 82% 72%,color-mix(in srgb,var(--scene-b) 18%,transparent),transparent 31%),
    linear-gradient(145deg,var(--scene-c),#08050e 60%,#020207);
  transition:background 1.5s ease;
}

/* Large soft cinematic light blooms */
.scene-orb{
  position:fixed;
  width:34vw;height:34vw;
  max-width:480px;max-height:480px;
  border-radius:50%;
  pointer-events:none;
  z-index:-1;
  filter:blur(35px);
  opacity:.13;
  background:radial-gradient(circle,var(--scene-a),transparent 68%);
  animation:orbFloat 11s ease-in-out infinite alternate;
}
.scene-orb.a{left:-10vw;top:15vh}
.scene-orb.b{right:-10vw;bottom:5vh;animation-delay:-4s}
@keyframes orbFloat{
  from{transform:translate3d(0,0,0) scale(.92)}
  to{transform:translate3d(4vw,-3vh,0) scale(1.12)}
}

/* Premium page content treatment */
.page .content,
.final-content{
  position:relative;
}
.page .content::after,
.final-content::after{
  content:"";
  position:absolute;
  inset:-1px;
  border-radius:inherit;
  pointer-events:none;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.10),transparent);
  background-size:220% 100%;
  animation:glassShine 7s ease-in-out infinite;
  opacity:.5;
}
@keyframes glassShine{
  0%,55%{background-position:180% 0}
  75%,100%{background-position:-20% 0}
}

/* Make buttons feel physical */
button{
  position:relative;
  overflow:hidden;
  transform:translateZ(20px);
  transition:transform .35s cubic-bezier(.16,1,.3,1),
             box-shadow .35s ease,
             border-color .35s ease !important;
}
button::before{
  content:"";
  position:absolute;
  width:120px;height:120px;
  left:var(--mx,50%);top:var(--my,50%);
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.25),transparent 68%);
  opacity:0;
  transition:opacity .25s ease;
  pointer-events:none;
}
button:hover{
  transform:translateY(-4px) translateZ(30px) scale(1.025);
  box-shadow:0 18px 45px rgba(0,0,0,.32),0 0 35px rgba(255,155,201,.12);
}
button:hover::before{opacity:1}
button:active{
  transform:translateY(1px) translateZ(10px) scale(.985);
}

/* Page entrance adds a subtle depth breathing effect */
.page.route-show .content,
.page.route-show .final-content{
  animation:contentReveal 1.1s cubic-bezier(.16,1,.3,1) both;
}
@keyframes contentReveal{
  0%{opacity:0;transform:translateZ(-60px) scale(.92)}
  55%{opacity:1}
  100%{opacity:1;transform:translateZ(0) scale(1)}
}

/* Star-field tint changes with the scene */
.star{transition:opacity 1.3s ease,box-shadow 1.3s ease}
body.scene-p2 .star{box-shadow:0 0 8px rgba(190,215,255,.8)}
body.scene-p4 .star{box-shadow:0 0 8px rgba(120,215,255,.75)}
body.scene-p5 .star{box-shadow:0 0 8px rgba(255,190,150,.75)}
body.scene-p6 .star{box-shadow:0 0 10px rgba(255,220,240,.9)}

/* Smooth progress indicator */
.progress .dot{
  transition:transform .55s cubic-bezier(.16,1,.3,1),
             opacity .5s ease,
             box-shadow .5s ease;
}
.progress .dot.on{
  transform:scale(1.22);
}

/* Typing box: calm, elegant reading pace */
body.scene-p5 #typing{
  min-height:180px;
  display:flex;
  align-items:center;
  justify-content:center;
}
body.scene-p5 #typedText{
  line-height:2.25 !important;
  text-shadow:0 0 24px rgba(255,180,205,.12);
}
body.scene-p5 .cursor{
  animation:cursorBreath 1.1s ease-in-out infinite !important;
}
@keyframes cursorBreath{
  0%,100%{opacity:.2}
  50%{opacity:1}
}

/* Transition veil */
#routeTransition{
  background:
    radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--scene-a) 22%,transparent),transparent 24%),
    radial-gradient(circle at 20% 80%,color-mix(in srgb,var(--scene-b) 14%,transparent),transparent 30%),
    linear-gradient(135deg,#030208f5,#170817f2) !important;
}
</style>


<script id="luxury-atmosphere-js">
(function(){
  const root=document.body;

  ["a","b"].forEach(cls=>{
    const o=document.createElement("div");
    o.className="scene-orb "+cls;
    root.appendChild(o);
  });

  /* Replace the transition veil with a fresh color pulse each time. */
  const veil=document.getElementById("routeTransition");
  if(veil){
    const observer=new MutationObserver(()=>{
      if(veil.classList.contains("play")){
        veil.style.setProperty("--scene-a",
          getComputedStyle(root).getPropertyValue("--scene-a"));
        veil.style.setProperty("--scene-b",
          getComputedStyle(root).getPropertyValue("--scene-b"));
      }
    });
    observer.observe(veil,{attributes:true,attributeFilter:["class"]});
  }
})();
</script>
